name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # NOT plain `github.ref` as the fallback. Both `push` and `pull_request`
  # fire for a same-repo PR branch. On `push`, `github.event.pull_request` is
  # null, so the group fell through to the second operand — and `github.ref`
  # there is `refs/heads/x`, which never matches `pull_request`'s
  # `head.ref` (bare `x`). That mismatch is the exact split this comment
  # claims to fix, so the fallback must be `github.ref_name`, not
  # `github.ref`: per GitHub's contexts reference, `github.ref_name` is "the
  # short ref name... [that] matches the branch or tag name shown on GitHub"
  # (e.g. `feature-branch-1`) for a branch push — the same string
  # `github.event.pull_request.head.ref` carries for that branch's PR run.
  # (The reverse substitution does not work: on a `pull_request` event
  # `github.ref_name` is `<pr_number>/merge`, not the branch name — which is
  # why `head.ref` must be checked first, not `ref_name`.) Keying on the PR's
  # head ref when there is one, falling back to the short ref name
  # otherwise, collapses same-repo push+PR runs into one cancellable group —
  # including every Dependabot PR.
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    # Explicit, not GitHub's 360-minute default: a hung test (e.g. the TUI's
    # headless bubbletea programs, which fail by hanging rather than
    # asserting per Landmine 16) would otherwise burn a run for hours before
    # anyone notices.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `check-latest: true` is LOAD-BEARING on every setup-go step in this
      # repo, and is the second half of the `go 1.25` directive's intent.
      # Without it, setup-go uses whatever Go the runner image already has
      # cached if it satisfies the directive — and a bare `1.25` is satisfied
      # by ANY 1.25.x, including a stale one. On 2026-08-15 that resolved to
      # go1.25.12 while the four reachable stdlib vulnerabilities published
      # 2026-08-13 (GO-2026-6218, GO-2026-6090, GO-2026-5972, GO-2026-5026)
      # were fixed in go1.25.13, so the audit job went red on code that had
      # not changed. The minor-only directive alone buys nothing if the
      # action never looks past the cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: make fmt-check
      - run: make vet
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
      # The action lints the default GOOS only, so every build-tagged file for
      # another platform is invisible to it — internal/agent/exec_windows.go
      # had never been linted at all until Task 3 checked by hand. The action
      # puts golangci-lint on PATH, so this reuses the binary it installed.
      - name: Lint the build-tagged files the default GOOS never sees
        run: make lint-cross
      # actionlint was pinned in the Makefile and installed by `make tools`
      # from the start, but nothing ever ran it in CI — so the workflow YAML
      # Dependabot edits weekly (.github/dependabot.yml) was validated only
      # by `make ci` on a contributor's machine, which a Dependabot PR never
      # runs. Installing just this one tool (not the other three `make
      # tools` also builds — golangci-lint is already on PATH via the action
      # above, gosec/govulncheck belong to `audit`) keeps this job fast while
      # still deferring the version pin and install command to the Makefile.
      - name: Install actionlint
        run: make tools-actionlint
      - name: Validate GitHub Actions workflow YAML
        run: make lint-workflows
      - run: make tidy-check
      - run: make cross

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # Built with THIS job's toolchain on purpose. Prebuilt analysis
      # binaries abort on toolchain skew ("file requires newer Go version").
      - name: Install pinned tools
        run: make tools
      - name: govulncheck, go mod verify, advisory gosec
        run: make security
      # NOT `-quiet`: with -quiet, gosec writes NO report file at all when it
      # finds nothing, and -no-fail additionally swallows a failed SSA build
      # (it exits 0 having analysed nothing). Combined with continue-on-error
      # on the upload, that chain can go green having performed zero security
      # analysis — masked today only by the tree happening to have 14
      # findings. (Dismissing an alert in the Security tab changes its state
      # on GitHub's side only; gosec still emits all 14 into the SARIF, so
      # this masking is unchanged by the 2026-08-09 triage.) Without -quiet
      # the SARIF is written unconditionally, so a
      # missing file becomes a real signal that the artifact step can catch.
      #
      # The log is teed because it is the ONLY place a failed analysis leaves
      # a trace: gosec logs "no ssa result", writes a valid SARIF anyway, and
      # exits 0. The next step reads this file.
      - name: gosec SARIF report
        if: always()
        # Explicit, and load-bearing: `pipefail` is what makes a missing or
        # crashing gosec fail this step instead of being swallowed by tee's
        # exit status. Same trap as the coverage step's below.
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gosec" -no-fail -fmt sarif -out gosec.sarif ./... 2>&1 | tee gosec.log
      # `if-no-files-found: error` below closed "gosec wrote no file at all".
      # This closes "gosec wrote a file from an analysis that never ran" — a
      # package with type errors yields exit 0 and a structurally valid SARIF
      # holding `"results": []`, which satisfies every other control in this
      # chain. The script deliberately does NOT look at the result count, so
      # genuine findings stay advisory and a genuinely clean tree stays green;
      # gosecguard_test.go pins both directions.
      - name: gosec must have actually analysed the tree
        if: always()
        run: .github/scripts/check-gosec-analysis.sh gosec.log gosec.sarif
      - name: Upload SARIF to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: gosec.sarif
      - name: Keep the SARIF as an artifact too
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gosec-sarif
          path: gosec.sarif
          # The one step in this chain that is NOT softened, so it is where a
          # gosec that analysed nothing actually surfaces.
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows and macOS both started advisory, so a red result would report
    # the gap instead of blocking every push, with the flag coming off per-OS
    # as each went green. macOS has now passed on every run since the first
    # (the prediction that its Unix-path fixtures would fail was simply
    # wrong), so its flag is off and a macOS regression is now blocking.
    #
    # Windows' flag is now off too. Its 19 failures were closed by
    # platform-aware fixtures and NO launcher change, exactly as predicted:
    # a home-directory helper that redirects USERPROFILE as well as HOME
    # (Landmine 8), GOOS-selected findPath candidates for qwen, kimiBinary()
    # for kimi's .exe suffix, and Unix guards on the file-mode assertions
    # Windows cannot express. Leaving it advisory now would let the same
    # class of drift return unnoticed — which is how it went unnoticed for
    # four phases.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # Called directly rather than through make: GNU make is not worth
      # assuming on the Windows runner for a single command.
      - name: Test
        run: go test ./... -count=1
      - name: Race detector (TUI)
        if: matrix.os == 'ubuntu-latest'
        run: make test-race
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        # `shell: bash` is LOAD-BEARING and must not be dropped as noise. With
        # no `shell:` key, GitHub runs `bash -e {0}` — WITHOUT pipefail — so
        # `make cover-check | tee` would exit with tee's status, i.e. 0, and
        # the 80% floor would never fail a run. The "below the floor" message
        # would appear in the job summary while the step, job, and run all went
        # green. Writing `shell: bash` explicitly is what selects
        # `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # One make invocation, not two: separate calls re-run the `cover`
          # prerequisite and with it the whole suite a second time.
          make cover-check cover-html 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-html
          path: coverage.html

  machine-independence:
    # Landmine 8. Its own job, not a step inside `test`: this is the check
    # this repo has historically needed most, and a green tick next to the
    # name is the point.
    name: machine-independence (Landmine 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: make test-isolated
