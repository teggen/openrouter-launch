# golangci-lint v2 schema. This file MUST stay on version "2":
# golangci-lint-action v9 (used by .github/workflows/ci.yml) refuses v1
# outright — "golangci-lint v1 is not supported by golangci-lint-action >= v7".
# If a locally installed v1 binary rejects this file, upgrade the binary
# (make tools). Downgrading the config breaks CI instead.
version: "2"

run:
  timeout: 5m

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck, unused.
  # In v2, gosimple was merged into staticcheck — do not try to enable it.
  default: standard
  enable:
    - misspell
    - revive
    - bodyclose
    - noctx
  exclusions:
    rules:
      # Test helpers routinely ignore errors from cleanup and fixture setup
      # where the failure mode is the test failing anyway.
      - path: _test\.go
        linters:
          - errcheck

      # Every fmt.Fprint* in internal/cli writes to cmd.OutOrStdout(),
      # cmd.ErrOrStderr(), or a tabwriter whose Flush() error IS returned
      # (agents.go, models.go, profile.go all end in `return w.Flush()`).
      # A failed write to the user's own terminal is not actionable: there
      # is no remaining channel on which to report it. Scoped to this path,
      # this linter, and this message so that every other unchecked error in
      # internal/cli — a dropped config.Save, say — still fails the gate.
      #
      # Known limit: errcheck's message names the FUNCTION, not the
      # destination, so this would also swallow a genuine unchecked
      # fmt.Fprintf(f, …) to a real file opened inside internal/cli. Nothing
      # in errcheck can distinguish the two. The compensating control is
      # TestWriteSitesAreExhaustivelyEnumerated (writesites_test.go, THIS
      # module), which fails if a write primitive appears outside this
      # repository's two sanctioned sites — neither of which is in
      # internal/cli. Landmine 6's other three sites now live in
      # github.com/teggen/agentlaunch; they are covered from here by
      # TestDependencyWriteSitesAreExhaustivelyEnumerated in the same file,
      # and in that module by its own copy of the walk.
      - path: internal/cli/
        linters:
          - errcheck
        text: fmt\.Fprint

      # revive's `exported` rule polices comment FORM ("comment on exported X
      # should be of the form ..."), which is prose style, not a defect class.
      # The gate is for bugs.
      #
      # Suppress it HERE, and never via `linters.settings.revive.rules`: that
      # block REPLACES revive's rule set rather than amending it, so naming a
      # single disabled rule there silently turns revive off completely.
      # Measured on this tree: 0 findings with the settings block, 26 without.
      - linters:
          - revive
        text: '^exported:'

      # The four unused-parameter hits are all in test helpers whose
      # signatures are fixed by the interface they stub.
      - path: _test\.go
        linters:
          - revive
        text: '^unused-parameter:'

      # NOTE: the Landmine 24 noctx exclusion that used to sit here is GONE
      # on purpose, not lost. It covered
      # internal/agent/exec_(wait|windows).go — the fork-and-wait handoff a
      # ConfigWriter agent takes instead of syscall.Exec — and those files
      # now live in github.com/teggen/agentlaunch, which carries the
      # exclusion and its full rationale in its own .golangci.yml. Leaving a
      # stale path here would be worse than useless: it matches nothing, so
      # it reads as coverage while providing none.

      # QF1001 is a style quickfix, not a defect check. The flagged site
      # asserts a three-way ordering — `!(a < b && b < c)` says "not in the
      # expected order" directly, where the De Morgan rewrite
      # (`a >= b || b >= c`) obscures it. This project's stated recurring
      # defect is tests that pass for the wrong reason, so rewriting an
      # assertion's boolean structure to satisfy a style check is a bad
      # trade. Scoped to tests and to this one check ID.
      - path: _test\.go
        linters:
          - staticcheck
        text: QF1001

formatters:
  # v2 moved gofmt/goimports/gofumpt out of linters into their own section.
  enable:
    - gofmt

issues:
  # Both default to a nonzero cap (max-issues-per-linter 50, max-same-issues
  # 3) which SILENTLY TRUNCATES the report: the first run of this config
  # showed 18 findings, and the true count was 28 — ten identical-message
  # errcheck hits were withheld. A gate that hides its 4th repeat of a
  # finding is not a gate. 0 means unlimited; this can only ever surface
  # more, never fewer, so it cannot mask a regression.
  max-issues-per-linter: 0
  max-same-issues: 0
